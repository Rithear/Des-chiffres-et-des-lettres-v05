<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 24px}
.hide{display:none!important}

h2{text-align:center;color:var(--ac)}
h3{color:var(--ac);margin:14px 0 6px;font-size:16px}
.btn{background:var(--card);color:var(--tx);border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer}
.btn.p{background:var(--ac);color:#14233f}.btn:disabled{opacity:.4}
.btn.sm{padding:8px 10px;font-size:14px;white-space:nowrap}

.mrow{display:flex;gap:8px;margin-bottom:12px}.mrow .mb{margin-bottom:0;flex:1}
.info{flex:0 0 62px;border:0;border-radius:10px;background:var(--card);color:var(--ac);font-size:24px;font-weight:800;cursor:pointer}

.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:10px}
.tl{display:flex;gap:6px}
.stg{text-align:center;color:var(--mut);font-size:14px;margin-bottom:8px}

.res{display:flex;justify-content:space-between;background:var(--card);padding:8px 12px;border-radius:8px;margin:4px 0}.res.ok span:last-child{color:var(--ok)}
.big{font-size:56px;font-weight:800;text-align:center;color:var(--ac)}
.ptot{text-align:center;font-weight:800;font-size:20px;margin:8px 0}
.tgt{display:flex;justify-content:center;gap:8px;margin:6px 0}

.tgt b.rl{color:var(--mut)}
.plates{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0}
.plate{padding:14px 0;font-size:clamp(16px,5.5vw,24px);font-weight:800;background:var(--ac);color:#14233f;border:0;border-radius:10px;cursor:pointer;text-align:center}
.plate.sel{outline:3px solid #fff}.plate.used,.plate.ph{opacity:.25}

.plate.pop{animation:pop .3s ease-out}
.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.ops .btn{font-size:26px;padding:10px 0}.ops .btn.sel{background:var(--ac);color:#14233f}
.cl{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border-radius:8px;padding:6px 8px;margin:4px 0}

.dnote{text-align:center;color:var(--mut);font-size:14px;line-height:1.5;margin:0 0 14px}
.mrow .info.rk{font-size:22px}.btn.done{background:var(--card);color:var(--tx)}.btn.done .ok2{color:var(--ok)}

.res.me{outline:2px solid var(--ac)}.res .rn{display:flex;gap:6px;min-width:0}.res .rn b{color:var(--ac);min-width:24px}

.sol h3{text-align:center}.sol .tiles .tile{cursor:default}.sol p{text-align:center;color:var(--mut);line-height:1.5}
.wl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0 10px}.wl span{background:var(--card);border-radius:6px;padding:4px 8px;font-weight:700;font-size:14px}

#psIn{text-transform:none;margin-top:8px}
.fi{text-transform:none;font-size:17px;text-align:left;padding:13px 14px;margin-bottom:10px}
.pw{position:relative}.pw .fi{padding-right:52px}.eye{position:absolute;right:6px;top:5px;height:42px;width:42px;border:0;background:none;color:var(--tx);font-size:20px;cursor:pointer;opacity:.7}

rD:`<p>Every day at midnight (French time), five new challenges: Longest Word in French and in English (30 seconds), Countdown Numbers (45 seconds), Final Words in French and in English (2 minutes).</p><p>The draw is the same for every player and each challenge can be played only once. For Longest Word, the draw always contains at least one 10-letter word.</p><p>Leaderboards: Longest Word by the longest word found, Countdown Numbers by the result closest to the target, Final Words by the number of words found. Ties are broken by time, to the hundredth of a second (time the word was submitted, time of the best calculation, time of the last word found).</p><p>Once you have played, the draw and the solutions appear below the leaderboard. If you haven't played yet, only the leaderboard is shown. Yesterday's draw and solutions are visible to everyone in the Yesterday tab.</p><p>Leaderboards: the top 10 of all players with an account, and the ranking among friends. As a guest, you can play but your result is not ranked.</p>`,

$("goMe").onclick=()=>launch(true);
$("goOther").onclick=()=>{$("liMail").value="";$("liPw").value="";goAuth("loginP","intro")};
$("goLogin").onclick=()=>goAuth("loginP","intro");$("goSignup").onclick=()=>goAuth("signupP","intro");
$("goGuest").onclick=()=>launch(false);
$("guestInfo").onclick=()=>modal(t("guest"),"<p>"+t("gInfo")+"</p>",[{l:t("close"),c:"p",f:closeModal}]);
// connexion
function notConf(em){modal(t("login"),"<p>"+t("eConf")+"</p>"+mMsg,[{l:t("close"),f:closeModal},{l:t("resend"),c:"p",f:mAct(async()=>{const r=await sb.auth.resend({type:"signup",email:em,options:{emailRedirectTo:RED}});am("mMsg",r.error?errT(r.error):t("resOk"),!r.error)})}])}
$("liGo").onclick=()=>busy("liGo",async()=>{if(authFrom==="intro")unlockA();const em=$("liMail").value.trim(),pw=$("liPw").value;am("liMsg","");
 if(!em||!pw)return am("liMsg",t("eFill"));if(!okMail(em))return am("liMsg",t("eMail"));if(!sb)return am("liMsg",t("eOff"));
 const r=await sb.auth.signInWithPassword({email:em,password:pw});
 if(r.error)return isCode(r.error,"email_not_confirmed",/not confirmed/)?notConf(em):am("liMsg",errT(r.error));
 await setSess(r.data.session);afterAuth()});
$("liForgot").onclick=()=>{$("fgMail").value=$("liMail").value.trim();am("fgMsg","");show("forgotP")};
$("fgBack").onclick=()=>show("loginP");
$("fgGo").onclick=()=>busy("fgGo",async()=>{const em=$("fgMail").value.trim();if(!okMail(em))return am("fgMsg",t("eMail"));if(!sb)return am("fgMsg",t("eOff"));
 const r=await sb.auth.resetPasswordForEmail(em,{redirectTo:RED});am("fgMsg",r.error?errT(r.error):t("fgOk"),!r.error)});
$("npGo").onclick=()=>busy("npGo",async()=>{const pw=$("npPw").value;am("npMsg","");if(pw.length<6)return am("npMsg",t("ePw6"));if(!sb||!SESS)return am("npMsg",t("lnkKo"));
 const r=await sb.auth.updateUser({password:pw});if(r.error)return am("npMsg",errT(r.error));
 recov=false;$("npPw").value="";renderIntro();show("intro");modal(t("npT"),"<p>"+t("npOk")+"</p>",[{l:t("ok"),c:"p",f:closeModal}])});
// création de compte
$("suGo").onclick=()=>busy("suGo",async()=>{if(authFrom==="intro")unlockA();const em=$("suMail").value.trim(),ps=cleanPs($("suPs").value),pw=$("suPw").value;am("suMsg","");
 if(!em||!ps||!pw)return am("suMsg",t("eFill"));if(!okMail(em))return am("suMsg",t("eMail"));if(ps.length>12)return am("suMsg",t("ePs"));if(pw.length<6)return am("suMsg",t("ePw6"));if(!sb)return am("suMsg",t("eOff"));
 const f=await sb.rpc("pseudo_free",{p_pseudo:ps});if(f.error)return am("suMsg",errT(f.error));if(f.data===false)return am("suMsg",t("ePsTaken"));
 const r=await sb.auth.signUp({email:em,password:pw,options:{data:{pseudo:ps},emailRedirectTo:RED}});
 if(r.error)return am("suMsg",/database error/i.test(r.error.message||"")?t("ePsTaken"):errT(r.error));
 const u=r.data&&r.data.user;if(u&&Array.isArray(u.identities)&&!u.identities.length)return am("suMsg",t("eExists"));
 try{localStorage.setItem("fwpseudo",ps)}catch(e){}$("suPw").value="";
 if(r.data.session){await setSess(r.data.session);afterAuth();return}
 $("liMail").value=em;$("liPw").value="";const fr=authFrom;modal(t("suOkT"),t("suOk",esc(em)),[{l:t("ok"),c:"p",f:()=>goAuth("loginP",fr)}])});
// profil
function openProf(from){profFrom=from||"home";am("pMsg","");renderProf();show("profP");refreshAcc()}
function renderProf(){const a=!!ME;$("pAcc").classList.toggle("hide",!a);$("pGst").classList.toggle("hide",a);
 if(a){$("pName").textContent=ME.pseudo;$("pMail").textContent=ME.email;$("pFr").innerHTML=esc("👥 "+t("friends"))+(ME.pending?'<span class="bdg">'+ME.pending+"</span>":"")}
 else{$("pUse").classList.toggle("hide",!ACC);if(ACC)$("pUse").textContent=t("useAcc",ACC.pseudo)}}
$("prof").onclick=()=>openProf("home");$("pBack").onclick=()=>backTo(profFrom);
$("pUse").onclick=()=>{setMe(ACC);renderProf()};
$("pLi").onclick=()=>{$("liPw").value="";goAuth("loginP","profP")};$("pSu").onclick=()=>goAuth("signupP","profP");
async function checkPw(pw){const r=await sb.auth.signInWithPassword({email:ME.email,password:pw});if(r.error){am("mMsg",isCode(r.error,"invalid_credentials",/invalid login/)?t("ePwCur"):errT(r.error));return false}return true}
$("pPs").onclick=()=>{if(!needSb())return;modal(t("chPs"),mIn("mA","text",t("psPh"),ME.pseudo)+mMsg,[{l:t("cancel"),f:closeModal},{l:t("ok"),c:"p",f:mAct(async()=>{
 const v=cleanPs($("mA").value);if(!v||v.length>12)return am("mMsg",t("ePs"));const r=await sb.rpc("set_pseudo",{p_pseudo:v});if(r.error)return am("mMsg",errT(r.error));
 if(r.data==="taken")return am("mMsg",t("ePsTaken"));if(r.data!=="ok")return am("mMsg",t(r.data==="auth"?"eAuth":"ePs"));
 ME.pseudo=v;putAcc();renderProf();renderProfB();renderIntro();closeModal();am("pMsg",t("psOk"),true)})}]);$("mA").maxLength=12};
$("pPw").onclick=()=>{if(!needSb())return;modal(t("chPw"),mIn("mA","password",t("pwCur"))+mIn("mB","password",t("pwNew"))+mMsg,[{l:t("cancel"),f:closeModal},{l:t("ok"),c:"p",f:mAct(async()=>{
 const a=$("mA").value,b=$("mB").value;if(!a||!b)return am("mMsg",t("eFill"));if(b.length<6)return am("mMsg",t("ePw6"));if(!await checkPw(a))return;
 const r=await sb.auth.updateUser({password:b});if(r.error)return am("mMsg",errT(r.error));closeModal();am("pMsg",t("pwOk"),true)})}])};
$("pMl").onclick=()=>{if(!needSb())return;modal(t("chMl"),t("mlH")+mIn("mA","email",t("mlNew"))+mIn("mB","password",t("pwCur"))+mMsg,[{l:t("cancel"),f:closeModal},{l:t("ok"),c:"p",f:mAct(async()=>{
 const em=$("mA").value.trim(),pw=$("mB").value;if(!em||!pw)return am("mMsg",t("eFill"));if(!okMail(em)||em.toLowerCase()===String(ME.email).toLowerCase())return am("mMsg",t("eMail"));if(!await checkPw(pw))return;
 const r=await sb.auth.updateUser({email:em},{emailRedirectTo:RED});if(r.error)return am("mMsg",errT(r.error));const u=r.data&&r.data.user;
 if(u&&String(u.email).toLowerCase()===em.toLowerCase()){ME.email=u.email;putAcc();renderProf();modal(t("chMl"),"<p>"+esc(t("mlDone",u.email))+"</p>",[{l:t("ok"),c:"p",f:closeModal}])}
 else modal(t("chMl"),t("mlOk",esc(em)),[{l:t("ok"),c:"p",f:closeModal}])})}])};
async function doLogout(){bye=true;try{if(sb)await sb.auth.signOut({scope:"local"})}catch(e){}SESS=null;setMe(null);ACC=null;putAcc();try{localStorage.removeItem("fwauth")}catch(e){}bye=false;renderIntro();show("intro")}
$("pOut").onclick=()=>modal(t("logout"),"<p>"+t("logoutQ")+"</p>",[{l:t("no"),f:closeModal},{l:t("yes"),c:"p",f:()=>{closeModal();doLogout()}}]);
$("pDel").onclick=()=>{if(!needSb())return;modal(t("delAcc"),t("delH")+mIn("mA","password",t("pw"))+mMsg,[{l:t("cancel"),f:closeModal},{l:t("delGo"),c:"p",f:mAct(async()=>{
 const pw=$("mA").value;if(!pw)return am("mMsg",t("eFill"));if(!await checkPw(pw))return;const id=ME.id,r=await sb.rpc("delete_my_account");if(r.error)return am("mMsg",errT(r.error));
 try{localStorage.removeItem("fwdaily:"+id)}catch(e){}await doLogout();modal(t("delAcc"),"<p>"+t("delOk")+"</p>",[{l:t("ok"),c:"p",f:closeModal}])})}])};
// amis
function openFr(){if(!needSb())return;am("frMsg","");$("frIn").value="";FRL=null;drawFr();show("frP");loadFr()}
async function loadFr(){const tok=++frTok;try{const r=await sb.rpc("friend_list");if(r.error)throw r.error;if(tok!==frTok)return;FRL=r.data||[];drawFr();if(ME){ME.pending=FRL.filter(x=>x.state==="in").length;renderProfB()}}catch(e){if(tok===frTok&&!FRL)$("frL").innerHTML='<p class="dnote">'+esc(errT(e))+"</p>"}}
function drawFr(){const F0=FRL;if(!F0){$("frL").innerHTML='<p class="dnote">'+t("frLoad")+"</p>";return}
 const sec=(st,title,bt)=>{const a=F0.filter(x=>x.state===st);return a.length?"<h3>"+title+"</h3>"+a.map(x=>'<div class="fr"><span>'+esc(x.pseudo)+(st==="out"?" <small>· "+t("frWait")+"</small>":"")+"</span>"+bt(x)+"</div>").join(""):""};
 $("frL").innerHTML=sec("in",t("frInT"),x=>'<button class="btn" data-fa="'+x.id+'">✓</button><button class="btn" data-fn="'+x.id+'">✕</button>')+sec("friend",t("frMine"),x=>'<button class="btn" data-fr="'+x.id+'">✕</button>')+sec("out",t("frOutT"),x=>'<button class="btn" data-fr="'+x.id+'">✕</button>')||'<p class="dnote">'+t("frNone")+"</p>"}
async function frDo(p,okMsg){try{const r=await p;if(r.error)throw r.error;am("frMsg",okMsg,true)}catch(e){am("frMsg",errT(e))}loadFr()}
$("frL").onclick=e=>{const b=e.target.closest("button");if(!b||!FRL||!sb)return;const id=b.dataset.fa||b.dataset.fn||b.dataset.fr,x=FRL.find(y=>y.id===id);if(!x)return;
 if(b.dataset.fa||b.dataset.fn)return frDo(sb.rpc("friend_answer",{p_user:id,p_ok:!!b.dataset.fa}),b.dataset.fa?t("frAcc",x.pseudo):"");
 modal(t("friends"),"<p>"+esc(t(x.state==="out"?"frCan":"frRm",x.pseudo))+"</p>",[{l:t("no"),f:closeModal},{l:t("yes"),c:"p",f:()=>{closeModal();frDo(sb.rpc("friend_remove",{p_user:id}),"")}}])};
$("frAdd").onclick=()=>busy("frAdd",async()=>{const v=cleanPs($("frIn").value);if(!v||!needSb())return;am("frMsg","");const r=await sb.rpc("friend_add",{p_pseudo:v});if(r.error)return am("frMsg",errT(r.error));
 const M={sent:["frSent",1],accepted:["frAcc",1],already:["frAlr",0],pending:["frPend",0],notfound:["frNf",0],self:["frSelf",0],auth:["eAuth",0]}[r.data]||["eGen",0];
 am("frMsg",t(M[0],v),!!M[1]);if(M[1])$("frIn").value="";loadFr()});
$("pFr").onclick=openFr;$("frBack").onclick=()=>openProf(profFrom);
applyLang();loadSB();
</script></body></html>
